<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unit Converter</title>
  <link rel="icon" type="image/svg+xml" href="../icons/unit-converter.svg">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main>
    <a href="../index.html">← All tools</a>
    <p class="tag">Utility</p>
    <h1 class="tool-title"><span class="tool-icon icon-unit-converter" aria-hidden="true"></span>Unit Converter</h1>
    <p>Convert length, mass, volume, and temperature.</p>
    <section class="panel">
      <form>
        <label>Value<input name="value" type="number" step="any" required inputmode="decimal"></label>
        <label>Unit<select name="unit"><option value="km">Kilometres → miles</option></select></label>
        <button type="submit">Convert</button>
      </form>
      <p id="status" class="notice" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="../app-core.js"></script>
  <script src="app.js"></script>
  <script src="../site.js"></script>
</body>
</html>
