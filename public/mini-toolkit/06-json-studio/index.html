<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSON Studio</title>
  <link rel="icon" type="image/svg+xml" href="../icons/json-studio.svg">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main>
    <a href="../index.html">← All tools</a>
    <p class="tag">Developer</p>
    <h1 class="tool-title"><span class="tool-icon icon-json-studio" aria-hidden="true"></span>JSON Studio</h1>
    <p>Validate, format, sort object keys, minify, copy, and download JSON locally.</p>
    <section class="panel">
      <label>Input JSON<textarea id="source" rows="9" spellcheck="false" placeholder='{"hello":"world"}'></textarea></label>
      <div id="controls" class="actions"></div>
      <label>Output<textarea id="result" rows="9" readonly spellcheck="false"></textarea></label>
      <p id="status" class="notice" role="status" aria-live="polite">Paste JSON to get started.</p>
    </section>
  </main>
  <script src="../app-core.js"></script>
  <script src="app.js"></script>
  <script src="../site.js"></script>
</body>
</html>
