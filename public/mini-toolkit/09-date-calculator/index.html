<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Date Calculator</title>
  <link rel="icon" type="image/svg+xml" href="../icons/date-calculator.svg">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main>
    <a href="../index.html">← All tools</a>
    <p class="tag">Utility</p>
    <h1 class="tool-title"><span class="tool-icon icon-date-calculator" aria-hidden="true"></span>Date Calculator</h1>
    <p>Compare two calendar dates, count weekdays, and see the inclusive date range.</p>
    <section class="panel">
      <form>
        <label>Start date<input name="start" type="date" required></label>
        <label>End date<input name="end" type="date" required></label>
        <button type="submit">Calculate</button>
      </form>
      <p id="status" class="notice" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="../app-core.js"></script>
  <script src="app.js"></script>
  <script src="../site.js"></script>
</body>
</html>
