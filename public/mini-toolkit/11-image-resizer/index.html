<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Resizer</title>
  <link rel="icon" type="image/svg+xml" href="../icons/image-resizer.svg">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main>
    <a href="../index.html">← All tools</a>
    <p class="tag">Media</p>
    <h1 class="tool-title"><span class="tool-icon icon-image-resizer" aria-hidden="true"></span>Image Resizer</h1>
    <p>Resize an image locally and export it as PNG, JPEG, or WebP.</p>
    <section class="panel">
      <form>
        <label>Image<input id="file" type="file" accept="image/*" required></label>
        <label>Output width in pixels<input name="width" type="number" min="1" max="8192" value="800" required></label>
        <label>Maximum file size (KB)<input name="targetSize" type="number" min="1" max="100000" step="1" placeholder="e.g. 100" aria-describedby="size-help"></label>
        <button type="submit">Resize and download</button>
      </form>
      <p id="size-help">Optional. The tool lowers JPEG or WebP quality first, then reduces dimensions as needed. For PNG it reduces dimensions.</p>
      <canvas id="preview" hidden></canvas>
      <p id="status" class="notice" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="../app-core.js"></script>
  <script src="app.js"></script>
  <script src="../site.js"></script>
</body>
</html>
